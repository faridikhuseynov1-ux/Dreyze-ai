name: Build Dreyze IDE

on:
  push:
    branches:
      - main
    paths:
      - 'dreyze-ide/**'
      - '.github/workflows/build-ide.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    
    defaults:
      run:
        working-directory: ./dreyze-ide

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Windows EXE
        run: npm run gulp vscode-win32-x64

      - name: Zip Build
        working-directory: .
        run: Compress-Archive -Path VSCode-win32-x64 -DestinationPath dreyze-ide-windows-x64.zip

      - name: Get short SHA
        shell: bash
        run: echo "sha8=${GITHUB_SHA:0:8}" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ env.sha8 }}
          name: Dreyze IDE Build ${{ env.sha8 }}
          files: dreyze-ide-windows-x64.zip
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dreyze-ide-windows-exe
          path: VSCode-win32-x64/
          retention-days: 7
