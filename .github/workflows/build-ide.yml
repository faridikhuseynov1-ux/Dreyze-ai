name: Build Dreyze IDE

on:
  push:
    branches:
      - main
    paths:
      - 'dreyze-ide/**'
      - '.github/workflows/build-ide.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./dreyze-ide

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev libsecret-1-dev libkrb5-dev python3

      - name: Install dependencies
        run: npm ci || npm install
        
      - name: Compile
        run: npm run compile
